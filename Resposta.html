<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #eef2f5; }
    .card-item { border-left: 4px solid #0d6efd; }
  </style>
</head>
<body class="p-3 p-md-4">
  <div class="container" style="max-width: 750px;">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body bg-primary text-white rounded-top">
        <h4 class="mb-1">Responder Solicitação de Cartelas</h4>
        <p class="mb-0 small opacity-75">Selecione uma resposta pré-definida e adicione observações para cada item abaixo.</p>
      </div>
      <div class="card-body" id="corpoFormulario">
        <div class="text-center py-4">Carregando itens solicitados...</div>
      </div>
    </div>
  </div>

  <script>
    const tokenEnvio = "<?= t ?>";
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    window.onload = () => {
      if (!tokenEnvio) { montarFormulario({ invalido: true }); return; }
      google.script.run
        .withSuccessHandler(montarFormulario)
        .withFailureHandler(err => montarFormulario({ erro: String(err.message || err) }))
        .obterItensPorToken(tokenEnvio);
    };

    function montarFormulario(dados) {
      const container = document.getElementById('corpoFormulario');

      if (dados.invalido || dados.erro) {
        container.innerHTML = '<div class="alert alert-warning">' + (dados.invalido ? 'Link inválido ou expirado. Solicite um novo e-mail.' : 'Não foi possível carregar os itens. Tente novamente.') + '</div>';
        return;
      }
      const itens = dados.itens;
      const opcoes = dados.opcoes;

      if (!itens || itens.length === 0) {
        container.innerHTML = '<div class="alert alert-success">Todos os itens deste envio já foram resolvidos. Nenhuma ação necessária.</div>';
        return;
      }

      let html = '<form id="formRespostas" onsubmit="salvarTudo(event)">';

      itens.forEach((item, index) => {
        const detalhes = [item.cliente, item.tamanho && 'Tam: ' + item.tamanho, item.oc && 'OC: ' + item.oc, item.codCliente && 'Cód: ' + item.codCliente].filter(Boolean).map(esc).join(' · ');
        html += `
          <div class="card card-item shadow-sm mb-3">
            <div class="card-body">
              <h6 class="fw-bold mb-1">${index + 1}. ${esc(item.nome)}</h6>
              <div class="text-muted small mb-2">${detalhes}</div>

              ${item.resposta ? `<div class="alert alert-secondary py-1 px-2 small mb-2">Último retorno enviado: <strong>${esc(item.resposta)}</strong> ${item.observacao ? `(${esc(item.observacao)})` : ''}</div>` : ''}

              <div class="row g-2">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary mb-1">Situação da Cartela *</label>
                  <select class="form-select form-select-sm resp-select" data-id="${esc(item.id)}" required>
                    <option value="">-- Selecione uma resposta --</option>
                    ${opcoes.map(op => `<option value="${esc(op)}" ${item.resposta === op ? 'selected' : ''}>${esc(op)}</option>`).join('')}
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary mb-1">Observação / Prazo / Rastreio</label>
                  <input type="text" maxlength="500" class="form-control form-control-sm resp-obs" data-id="${esc(item.id)}"
                         placeholder="Digite detalhes ou observações..." value="${esc(item.observacao)}">
                </div>
              </div>
            </div>
          </div>
        `;
      });

      html += `
        <div class="d-grid mt-4">
          <button type="submit" id="btnSalvar" class="btn btn-success btn-lg fw-bold">
            ✅ Enviar Respostas
          </button>
        </div>
      </form>`;

      container.innerHTML = html;
    }

    function salvarTudo(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerText = 'Gravando respostas...';

      const selects = document.querySelectorAll('.resp-select');
      const obsInputs = document.querySelectorAll('.resp-obs');
      const payload = [];

      selects.forEach((sel, idx) => {
        payload.push({
          id: sel.getAttribute('data-id'),
          resposta: sel.value,
          observacao: obsInputs[idx].value.trim()
        });
      });

      google.script.run
        .withSuccessHandler(() => {
          document.getElementById('corpoFormulario').innerHTML = `
            <div class="text-center py-5">
              <h3 class="text-success fw-bold mb-2">✔️ Respostas enviadas com sucesso!</h3>
              <p class="text-muted">A planilha e o painel do solicitante já foram atualizados automaticamente.</p>
            </div>
          `;
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerText = '✅ Enviar Respostas';
          alert('Não foi possível gravar: ' + String(err.message || err).replace(/^(Error|Exception): /, ''));
        })
        .salvarRespostasFornecedor(tokenEnvio, payload);
    }
  </script>
</body>
</html>
