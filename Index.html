<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .item-card { background: white; border-radius: 8px; border-left: 5px solid #ccc; margin-bottom: 12px; transition: 0.2s; }
    .item-card.desabilitado { opacity: 0.6; }
    .status-Respondido { border-left-color: #28a745; }
    .status-Aguardando { border-left-color: #ffc107; }
    .status-Reenviado { border-left-color: #dc3545; }
    .resposta-box { background-color: #f8f9fa; border-top: 1px dashed #dee2e6; padding: 10px 15px; margin-top: 8px; border-radius: 0 0 8px 8px; }
  </style>
</head>
<body class="p-3 p-md-4">

  <div id="telaLogin" class="container" style="max-width: 380px; display: none;">
    <div class="card shadow-sm mt-5">
      <div class="card-body">
        <h4 class="fw-bold mb-3">Gestão de Cartelas</h4>
        <form id="formLogin">
          <input id="loginUsuario" class="form-control mb-2" placeholder="Usuário" autocomplete="username" required>
          <input id="loginSenha" type="password" class="form-control mb-3" placeholder="Senha" autocomplete="current-password" required>
          <div id="loginErro" class="text-danger small mb-2"></div>
          <button id="btnLogin" type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <div id="telaPainel" class="container" style="max-width: 900px; display: none;">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h3 class="mb-0 fw-bold">Solicitação de Cartelas</h3>
        <small class="text-muted" id="infoSync"></small>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm" onclick="atualizar()">🔄 Atualizar Respostas</button>
        <button class="btn btn-outline-primary btn-sm" id="btnSync" onclick="iniciar(true)">⬇️ Sincronizar Produção</button>
        <button class="btn btn-outline-dark btn-sm" onclick="sair(false)">Sair</button>
      </div>
    </div>

    <div id="alertaSync" class="alert alert-warning py-2 small" style="display: none;"></div>
    <div id="alertaEmails" class="alert alert-warning py-2 small" style="display: none; white-space: pre-line;"></div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex gap-2 flex-wrap">
          <button id="btnEnviar" class="btn btn-success fw-bold" onclick="enviarEmails()">📧 Disparar Selecionados</button>
          <button class="btn btn-light border ms-auto" onclick="selecionarVisiveis()">Marcar/Desmarcar Visíveis</button>
        </div>
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-8"><input id="busca" class="form-control" placeholder="Buscar por item, cliente, ordem de compra ou código..."></div>
      <div class="col-md-4">
        <select id="filtroStatus" class="form-select">
          <option value="">Todos os status</option>
          <option value="novo">Não enviado</option>
          <option value="aguardando">Aguardando resposta</option>
          <option value="reenviado">Reenviado</option>
          <option value="respondido">Respondido</option>
        </select>
      </div>
    </div>

    <div id="listaItens"></div>
  </div>

  <script>
    let TOKEN = lerToken();
    let dados = { itens: [] };
    const selecionados = new Set();

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

    function lerToken() { try { return sessionStorage.getItem('cartelas_token'); } catch (e) { return null; } }
    function salvarToken(t) { try { t ? sessionStorage.setItem('cartelas_token', t) : sessionStorage.removeItem('cartelas_token'); } catch (e) {} }

    function mostrar(tela) {
      document.getElementById('telaLogin').style.display = tela === 'login' ? 'block' : 'none';
      document.getElementById('telaPainel').style.display = tela === 'painel' ? 'block' : 'none';
    }

    function falha(err) {
      const m = String((err && err.message) || err).replace(/^(Error|Exception): /, '');
      if (m.includes('SESSAO_EXPIRADA')) { sair(true); return; }
      alert('Atenção: ' + m);
    }

    window.onload = () => {
      document.getElementById('formLogin').addEventListener('submit', entrar);
      document.getElementById('busca').addEventListener('input', renderizar);
      document.getElementById('filtroStatus').addEventListener('change', renderizar);
      document.getElementById('listaItens').addEventListener('change', aoMarcar);
      document.getElementById('listaItens').addEventListener('click', ev => {
        const btn = ev.target.closest('.btn-reenviar');
        if (btn) reenviarItem(btn.dataset.id, btn);
      });
      if (TOKEN) { mostrar('painel'); iniciar(false); } else { mostrar('login'); }
    };

    function entrar(ev) {
      ev.preventDefault();
      const btn = document.getElementById('btnLogin');
      const erro = document.getElementById('loginErro');
      btn.disabled = true;
      erro.innerText = '';
      google.script.run
        .withSuccessHandler(r => {
          btn.disabled = false;
          TOKEN = r.token;
          salvarToken(TOKEN);
          document.getElementById('loginSenha').value = '';
          mostrar('painel');
          iniciar(false);
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          erro.innerText = String(err.message || err).replace(/^(Error|Exception): /, '');
        })
        .login(document.getElementById('loginUsuario').value, document.getElementById('loginSenha').value);
    }

    function sair(expirou) {
      if (TOKEN && !expirou) google.script.run.logout(TOKEN);
      TOKEN = null;
      salvarToken(null);
      selecionados.clear();
      dados = { itens: [] };
      document.getElementById('loginErro').innerText = expirou ? 'Sessão expirada. Entre novamente.' : '';
      mostrar('login');
    }

    function iniciar(forcar) {
      document.getElementById('listaItens').innerHTML = '<div class="text-center py-4 text-muted">' + (forcar ? 'Sincronizando com a planilha de produção...' : 'Carregando itens...') + '</div>';
      google.script.run.withSuccessHandler(aplicar).withFailureHandler(falha).sincronizarFonte(TOKEN, forcar);
    }

    function atualizar() {
      document.getElementById('listaItens').innerHTML = '<div class="text-center py-4 text-muted">Atualizando...</div>';
      google.script.run.withSuccessHandler(aplicar).withFailureHandler(falha).obterDadosPainel(TOKEN);
    }

    const selecionavel = i => i.destinatarios > 0 && tipoStatus(i) === 'novo';

    function aplicar(d) {
      dados = d;
      const ids = new Set(d.itens.filter(selecionavel).map(i => i.id));
      Array.from(selecionados).forEach(id => { if (!ids.has(id)) selecionados.delete(id); });
      document.getElementById('infoSync').innerText = d.ultimaSync ? 'Última sincronização com a produção: ' + d.ultimaSync : 'Ainda não sincronizado com a produção.';
      const alerta = document.getElementById('alertaSync');
      alerta.style.display = d.erroSync ? 'block' : 'none';
      alerta.innerText = d.erroSync ? '⚠️ Falha na última sincronização: ' + d.erroSync : '';
      const avisos = d.avisosEmails || [];
      const alertaEmails = document.getElementById('alertaEmails');
      alertaEmails.style.display = avisos.length ? 'block' : 'none';
      alertaEmails.innerText = avisos.length ? '⚠️ Linhas da aba Emails com problema:\n' + avisos.join('\n') : '';
      renderizar();
    }

    function tipoStatus(item) {
      const s = item.status;
      return s.includes('Respondido') ? 'respondido' : s.includes('Reenviado') ? 'reenviado' : s.includes('Aguardando') ? 'aguardando' : 'novo';
    }

    function visiveis() {
      const q = norm(document.getElementById('busca').value.trim());
      const st = document.getElementById('filtroStatus').value;
      return dados.itens.filter(i =>
        (!st || tipoStatus(i) === st) &&
        (!q || norm([i.descricao, i.cliente, i.grupo, i.oc, i.codCliente, i.tamanho].join(' ')).includes(q)));
    }

    function renderizar() {
      const container = document.getElementById('listaItens');
      const lista = visiveis();
      if (!lista.length) {
        container.innerHTML = '<div class="alert alert-info">' + (dados.itens.length ? 'Nenhum item corresponde ao filtro.' : 'Nenhum item pendente de cartela na planilha de produção.') + '</div>';
        return;
      }

      const grupos = new Map();
      lista.forEach(i => {
        if (!grupos.has(i.grupo)) grupos.set(i.grupo, []);
        grupos.get(i.grupo).push(i);
      });
      const nomes = Array.from(grupos.keys()).sort((a, b) => (a === '') - (b === '') || a.localeCompare(b));

      container.innerHTML = nomes.map(nome => {
        const itens = grupos.get(nome);
        const ref = itens[0];
        const selecionaveis = itens.filter(selecionavel);
        const todos = selecionaveis.length > 0 && selecionaveis.every(i => selecionados.has(i.id));
        const badge = nome === ''
          ? '<span class="badge bg-danger">Sem e-mail cadastrado na aba Emails</span>'
          : ref.destinatarios === 0
            ? '<span class="badge bg-danger">Sem destinatário cadastrado</span>'
            : '<span class="badge bg-light text-dark border">' + ref.destinatarios + ' destinatário(s) · ' + ref.copias + ' cópia(s)</span>';

        return '<div class="mb-4">' +
          '<div class="d-flex align-items-center gap-2 mb-2">' +
            '<input type="checkbox" class="form-check-input chk-grupo mt-0" data-grupo="' + esc(nome) + '"' + (todos ? ' checked' : '') + (selecionaveis.length ? '' : ' disabled') + '>' +
            '<h6 class="fw-bold mb-0">' + esc(nome || 'Clientes sem cadastro de e-mail') + '</h6>' + badge +
            '<span class="text-muted small ms-auto">' + itens.length + ' item(ns)</span>' +
          '</div>' + itens.map(cartaoItem).join('') + '</div>';
      }).join('');
    }

    function cartaoItem(item) {
      const tipo = tipoStatus(item);
      const classe = { respondido: 'status-Respondido', reenviado: 'status-Reenviado', aguardando: 'status-Aguardando', novo: '' }[tipo];
      const cor = { respondido: 'bg-success', reenviado: 'bg-danger', aguardando: 'bg-warning text-dark', novo: 'bg-secondary' }[tipo];
      const pode = item.destinatarios > 0;
      const detalhes = [item.cliente, item.tamanho && 'Tam: ' + item.tamanho, item.oc && 'OC: ' + item.oc, item.codCliente && 'Cód: ' + item.codCliente].filter(Boolean).map(esc).join(' · ');

      return '<div class="item-card shadow-sm ' + classe + (pode ? '' : ' desabilitado') + '">' +
        '<div class="p-3 d-flex align-items-center justify-content-between">' +
          '<div class="form-check d-flex align-items-center gap-2 mb-0">' +
            '<input class="form-check-input chk-item" type="checkbox" value="' + esc(item.id) + '" id="chk_' + esc(item.id) + '" style="transform: scale(1.3);"' + (selecionados.has(item.id) ? ' checked' : '') + (selecionavel(item) ? '' : ' disabled') + '>' +
            '<label class="form-check-label ms-2" for="chk_' + esc(item.id) + '">' +
              '<span class="fw-bold fs-6">' + esc(item.descricao) + '</span><br>' +
              '<span class="text-muted fw-normal" style="font-size:12px;">' + detalhes + '</span>' +
            '</label>' +
          '</div>' +
          '<div class="d-flex align-items-center gap-2">' +
            '<span class="badge ' + cor + '">' + esc(item.status) + '</span>' +
            (tipo !== 'novo' && pode ? '<button class="btn btn-outline-danger btn-sm btn-reenviar" data-id="' + esc(item.id) + '">🔁 Reenviar</button>' : '') +
          '</div>' +
        '</div>' +
        (item.resposta || item.observacao
          ? '<div class="resposta-box"><div class="row align-items-center">' +
              '<div class="col-md-9"><span class="fw-bold text-dark">Retorno:</span> ' +
                '<span class="badge bg-primary me-2">' + esc(item.resposta || 'Sem opção') + '</span>' +
                '<span class="text-secondary">' + (item.observacao ? '💬 "' + esc(item.observacao) + '"' : '<em>Sem observações</em>') + '</span></div>' +
              '<div class="col-md-3 text-md-end text-muted" style="font-size: 11px;">Atualizado em: ' + esc(item.data) + '</div>' +
            '</div></div>'
          : '<div class="resposta-box text-muted" style="font-size: 13px;"><em>Nenhum retorno registrado ainda para este item.</em></div>') +
      '</div>';
    }

    function aoMarcar(ev) {
      const el = ev.target;
      if (el.classList.contains('chk-item')) {
        el.checked ? selecionados.add(el.value) : selecionados.delete(el.value);
        renderizar();
      } else if (el.classList.contains('chk-grupo')) {
        visiveis().filter(i => i.grupo === el.dataset.grupo && selecionavel(i))
          .forEach(i => el.checked ? selecionados.add(i.id) : selecionados.delete(i.id));
        renderizar();
      }
    }

    function selecionarVisiveis() {
      const alvo = visiveis().filter(selecionavel);
      const todos = alvo.length > 0 && alvo.every(i => selecionados.has(i.id));
      alvo.forEach(i => todos ? selecionados.delete(i.id) : selecionados.add(i.id));
      renderizar();
    }

    function enviarEmails() {
      const sel = dados.itens.filter(i => selecionados.has(i.id));
      if (!sel.length) {
        alert('Selecione pelo menos um item na lista!');
        return;
      }

      const porGrupo = {};
      sel.forEach(i => {
        const g = porGrupo[i.grupo] || (porGrupo[i.grupo] = { n: 0, d: i.destinatarios, c: i.copias });
        g.n++;
      });
      const resumo = Object.keys(porGrupo).map(g => '• ' + g + ': ' + porGrupo[g].n + ' item(ns) → ' + porGrupo[g].d + ' destinatário(s), ' + porGrupo[g].c + ' cópia(s)').join('\n');
      if (!confirm('Disparar solicitação para:\n' + resumo + '\n\nConfirmar envio?')) return;
      executarEnvio(sel.map(i => i.id), false, document.getElementById('btnEnviar'));
    }

    function reenviarItem(id, btn) {
      const item = dados.itens.find(i => i.id === id);
      if (!item) return;
      if (!confirm('REENVIAR solicitação:\n• ' + item.descricao + ' (' + item.grupo + ')\n→ ' + item.destinatarios + ' destinatário(s), ' + item.copias + ' cópia(s)\n\nConfirmar envio?')) return;
      executarEnvio([id], true, btn);
    }

    function executarEnvio(ids, ehReenvio, btn) {
      const textoOriginal = btn.innerText;
      btn.disabled = true;
      btn.innerText = 'Enviando...';

      google.script.run
        .withSuccessHandler(r => {
          btn.disabled = false;
          btn.innerText = textoOriginal;
          if (!ehReenvio) selecionados.clear();
          aplicar(r.dados);
          let texto = r.enviados.length
            ? 'Enviado:\n' + r.enviados.map(e => '• ' + e.cliente + ': ' + e.itens + ' item(ns) → ' + e.destinatarios + ' destinatário(s), ' + e.copias + ' cópia(s)').join('\n')
            : 'Nenhum e-mail enviado.';
          if (r.pulados.length) texto += '\n\nNão enviado:\n' + r.pulados.map(p => '• ' + p).join('\n');
          alert(texto);
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerText = textoOriginal;
          falha(err);
        })
        .dispararSolicitacao(TOKEN, ids, ehReenvio);
    }
  </script>
</body>
</html>
